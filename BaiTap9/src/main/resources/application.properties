# Tự động nạp cấu hình từ file .env nếu có
spring.config.import=optional:file:.env[.properties]

spring.application.name=springboot1-9
server.port=${SERVER_PORT:8081}

spring.main.allow-bean-definition-overriding=true

spring.thymeleaf.cache=false

# Cấu hình Database đọc linh hoạt từ .env (có giá trị fallback mặc định)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=webst9;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234567@a$}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Cấu hình Data Seeding
app.seed.enabled=${APP_SEED_ENABLED:true}