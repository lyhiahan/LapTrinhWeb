<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - UTEShop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>UTEShop</h1>
        <h2>Đăng nhập</h2>

        <div class="alert error" th:if="${param.error}">
            Username/email hoặc password không đúng
        </div>

        <div class="alert success" th:if="${param.logout}">
            Bạn đã đăng xuất thành công
        </div>

        <form th:action="@{/login}" method="post">
            <div>
                <label>Username hoặc Email</label>
                <input type="text"
                       name="username"
                       placeholder="Nhập username hoặc email"
                       required
                       autofocus>
            </div>

            <div>
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Nhập password"
                       required>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="btn primary full mt" type="submit">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
