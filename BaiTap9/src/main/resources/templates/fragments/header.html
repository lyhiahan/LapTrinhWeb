<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTEShop</a>
    </div>

    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
             alt="Avatar"
             class="thumb"
             style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;">

        <span style="font-weight: 700; color: #fff;"
              th:text="${#authentication.principal.fullName}">
            Lý Gia Hân
        </span>

        <span style="color: #cbd5e1; font-size: 14px;"
              th:text="'(' + ${#authentication.principal.username} + ')'">
            (user01)
        </span>

        <span style="color: #cbd5e1; font-size: 14px;"
              th:text="'| ' + ${#authentication.principal.email}">
            | user01@gmail.com
        </span>

        <span style="background-color: rgba(255, 255, 255, 0.18); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #f1f5f9;"
              th:text="${#authentication.principal.role}">
            ROLE_USER
        </span>

        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 8px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}" style="color: #fff; text-decoration: none; font-weight: 600;">Đăng nhập</a>
    </div>
</header>
</body>
</html>
