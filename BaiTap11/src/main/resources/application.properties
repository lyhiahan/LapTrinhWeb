# Server Port
server.port=8080

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# Database Connection (Microsoft SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1;instanceName=SQLEXPRESS01;databaseName=WebProject_24133016;encrypt=true;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Custom Upload Folder Path
app.upload.dir=upload

# SMTP configuration. Keep credentials outside source code.
# PowerShell example:
#   $env:SMTP_USERNAME="your-account@gmail.com"
#   $env:SMTP_PASSWORD="your-google-app-password"
#   $env:SMTP_FROM="your-account@gmail.com"
app.mail.host=${SMTP_HOST:smtp.gmail.com}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.mail.auth=${SMTP_AUTH:true}
app.mail.starttls=${SMTP_STARTTLS:true}

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
