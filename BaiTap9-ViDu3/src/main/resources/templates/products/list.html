<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Products')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main class="container">
<h1>Quản lý Products</h1>
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<div class="toolbar">
    <form th:action="@{/products}" method="get">
        <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
        <input type="hidden" name="size" th:value="${size}">
        <button type="submit" class="btn-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Tìm kiếm
        </button>
    </form>
    <a class="btn-create" th:href="@{/products/create}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        + Thêm Product
    </a>
</div>

<div class="table-responsive">
<table>
    <thead>
        <tr>
            <th class="col-stt">STT</th>
            <th class="col-id">ID</th>
            <th class="col-thumb">Ảnh</th>
            <th class="col-name">Tên sản phẩm</th>
            <th class="col-price">Giá (VNĐ)</th>
            <th class="col-user">Người tạo</th>
            <th class="col-action">Thao tác</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p, stat : ${products.content}">
            <td class="col-stt" th:text="${(products.number * products.size) + stat.count}"></td>
            <td class="col-id" th:text="${p.id}"></td>
            <td class="col-thumb">
                <img th:if="${p.imageUrl != null}" th:src="${#strings.substringBefore(p.imageUrl, '|')}" class="thumb" alt="Product image">
                <div th:unless="${p.imageUrl != null}" class="thumb-placeholder" title="Chưa có hình ảnh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>No img</span>
                </div>
            </td>
            <td class="col-name" th:text="${p.name}"></td>
            <td class="col-price" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}"></td>
            <td class="col-user" th:text="${p.username}"></td>
            <td class="col-action">
                <div class="actions" th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROLE_ADMIN'')') or #authentication.name == p.username}">
                    <a class="btn-action btn-edit" th:href="@{/products/edit/{id}(id=${p.id})}" title="Chỉnh sửa sản phẩm">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                        Edit
                    </a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa product này?')">
                        <button type="submit" class="btn-action btn-delete" title="Xóa sản phẩm">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Delete
                        </button>
                    </form>
                </div>
                <span th:unless="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROLE_ADMIN'')') or #authentication.name == p.username}" style="color: #94a3b8; font-size: 13px;">Chỉ xem</span>
            </td>
        </tr>
        <tr th:if="${products.empty}">
            <td colspan="7" style="text-align: center; padding: 32px; color: #64748b;">Không có dữ liệu sản phẩm nào.</td>
        </tr>
    </tbody>
</table>
</div>

<div class="pagination">
<a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1},size=${size},keyword=${keyword})}">«</a>
<span th:each="i : ${#numbers.sequence(0, products.totalPages > 0 ? products.totalPages - 1 : 0)}">
    <a th:classappend="${i == products.number ? 'active' : ''}" th:href="@{/products(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
</span>
<a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1},size=${size},keyword=${keyword})}">»</a>
</div>
</main>
</div>
</body>
</html>
