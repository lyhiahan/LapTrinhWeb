<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main class="container">
<h1>Quản lý Users</h1>
<div th:if="${createdPassword}" class="alert info" style="background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
    <div>
        <strong>🔑 Mật khẩu ban đầu của user <span th:text="${createdUsername}"></span>:</strong>
        <code style="background: #d1fae5; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 1.1em; color: #047857;" id="passValue" th:text="${createdPassword}"></code>
        <div style="font-size: 0.85em; color: #047857; margin-top: 4px;">⚠ Mật khẩu này chỉ hiển thị một lần. Hãy sao chép và gửi cho người dùng.</div>
    </div>
    <button type="button" class="button" style="padding: 6px 14px; font-size: 0.85rem;" onclick="navigator.clipboard.writeText(document.getElementById('passValue').innerText); this.innerText='Đã sao chép!';">Sao chép</button>
</div>
<div th:if="${success && !createdPassword}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>

<div class="toolbar">
    <form th:action="@{/users}" method="get">
        <input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên...">
        <input type="hidden" name="size" th:value="${size}">
        <button type="submit" class="btn-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Tìm kiếm
        </button>
    </form>
    <a class="btn-create" th:href="@{/users/create}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        + Thêm User
    </a>
</div>

<div class="table-responsive">
<table>
    <thead>
        <tr>
            <th class="col-u-id">ID</th>
            <th class="col-u-username">Username</th>
            <th class="col-u-email">Email</th>
            <th class="col-u-fullname">Họ tên</th>
            <th class="col-u-role">Role</th>
            <th class="col-u-status">Trạng thái</th>
            <th class="col-u-count">Products</th>
            <th class="col-u-action">Thao tác</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="u : ${users.content}">
            <td class="col-u-id" th:text="${u.id}"></td>
            <td class="col-u-username" th:text="${u.username}"></td>
            <td class="col-u-email" th:text="${u.email}"></td>
            <td class="col-u-fullname" th:text="${u.fullName}"></td>
            <td class="col-u-role">
                <span class="badge" th:classappend="${u.roleName == 'ROLE_ADMIN' || u.roleName == 'admin' ? 'badge-admin' : 'badge-user'}" th:text="${u.roleName}"></span>
            </td>
            <td class="col-u-status">
                <span class="badge badge-active" th:if="${u.enabled}">ACTIVE</span>
                <span class="badge badge-inactive" th:unless="${u.enabled}">INACTIVE</span>
            </td>
            <td class="col-u-count" th:text="${u.productCount}"></td>
            <td class="col-u-action">
                <div class="actions">
                    <a class="btn-action btn-edit" th:href="@{/users/edit/{id}(id=${u.id})}" title="Chỉnh sửa người dùng">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                        Edit
                    </a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa user này?')">
                        <button type="submit" class="btn-action btn-delete" title="Xóa người dùng">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Delete
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${users.empty}">
            <td colspan="8" style="text-align: center; padding: 32px; color: #64748b;">Không có dữ liệu người dùng nào.</td>
        </tr>
    </tbody>
</table>
</div>

<div class="pagination">
<a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">«</a>
<span th:each="i : ${#numbers.sequence(0, users.totalPages > 0 ? users.totalPages - 1 : 0)}">
<a th:classappend="${i == users.number ? 'active' : ''}" th:href="@{/users(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
</span>
<a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">»</a>
</div>
</main>
</div>
</body>
</html>
