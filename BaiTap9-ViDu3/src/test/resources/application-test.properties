# Cấu hình độc lập cho môi trường Test
# Sử dụng H2 in-memory DB để hoàn toàn không chạm vào CSDL SQL Server của dev/prod
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Tắt DataInitializer để không chạy bất kỳ migrate schema hay seed dữ liệu vào DB test
app.initializer.enabled=false

# Cấu hình giả lập cho các dịch vụ bên ngoài (Mail, Cloudinary)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=testuser
spring.mail.password=testpass
cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=abcdefghij
