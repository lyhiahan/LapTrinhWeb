# Server Port
server.port=8080

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# Database Connection (Microsoft SQL Server)
spring.datasource.url=jdbc:sqlserver://127.0.0.1;instanceName=SQLEXPRESS01;databaseName=ShoppingServiceMVC;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=giahan

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Custom Upload Folder Path
app.upload.dir=upload
