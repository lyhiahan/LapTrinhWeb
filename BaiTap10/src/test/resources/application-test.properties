# ===============================
# CẤU HÌNH DATABASE CHO KIỂM THỬ TỰ ĐỘNG (IN-MEMORY H2 DATABASE)
# Cách ly hoàn toàn, không ghi hay tác động vào SQL Server của ứng dụng
# ===============================
spring.datasource.url=jdbc:h2:mem:test_jwt_db;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Nimbus JWT cho môi trường test
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000

# Vô hiệu hóa seed admin trong test để mỗi test tự khởi tạo dữ liệu mong muốn
app.security.admin.seed-enabled=false
