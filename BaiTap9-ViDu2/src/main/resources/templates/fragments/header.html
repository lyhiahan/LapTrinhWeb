<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav>
        <a class="brand" th:href="@{/}">
            UTEShop
        </a>
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="user-nav-box">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar"
                 width="40"
                 height="40"
                 style="border-radius:50%; object-fit:cover;">

            <!-- Full name -->
            <span style="font-weight: 600;" th:text="${#authentication.principal.fullName}">
                Lý Gia Hân
            </span>

            <!-- Username -->
            <span style="color: #64748b; font-size: 13px;" th:text="'(' + ${#authentication.principal.username} + ')'">
                (nguyenvana)
            </span>

            <!-- Email -->
            <span style="color: #64748b; font-size: 13px;" th:text="${#authentication.principal.email}">
                email@gmail.com
            </span>

            <!-- Role -->
            <span class="role-badge" th:text="${#authentication.principal.role}">
                ROLE_USER
            </span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn-logout">
                    Đăng xuất
                </button>
            </form>
        </div>
        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a class="btn-login" th:href="@{/login}">
                Đăng nhập
            </a>
        </div>
    </nav>
</header>
</body>
</html>
